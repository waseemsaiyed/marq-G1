<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress Vite HMR / WebSocket reconnection noise in iframe environment per platform guidelines
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          const msg = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].message) || '';
          if (
            typeof msg === 'string' &&
            (msg.includes('[vite]') || msg.includes('WebSocket') || msg.includes('failed to connect to websocket'))
          ) {
            console.debug(...args);
            return;
          }
          origError.apply(console, args);
        };
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MARQ W-1</title>
    <meta name="description" content="Hospital-grade clinical smart bed remote controller featuring bed articulation, paired hardware device management, patient mass &amp; stability tracking, live vitals, diagnostic reports, medication records, and emergency clinical charting." />
    
    <!-- PWA & Mobile Capabilities -->
    <meta name="theme-color" content="#2738BA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MarQ" />
    <link rel="apple-touch-icon" href="/marq-logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/marq-logo.svg" />
    <link rel="shortcut icon" href="/marq-logo.svg" />

    <!-- Open Graph & Meta -->
    <meta property="og:title" content="MARQ W-1" />
    <meta property="og:description" content="Hospital-grade clinical smart bed remote controller featuring bed articulation, paired hardware device management, patient mass &amp; stability tracking, live vitals, diagnostic reports, medication records, and emergency clinical charting." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>

</html>
