<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004F8C" />
      <stop offset="100%" stop-color="#002D54" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7800" />
      <stop offset="100%" stop-color="#FF9E40" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  
  <!-- Subtle circular halo -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="8" stroke-dasharray="12 12" />
  
  <!-- Medical Cross Badge -->
  <g transform="translate(256, 150)">
    <rect x="-16" y="-48" width="32" height="96" rx="10" fill="url(#accentGrad)" />
    <rect x="-48" y="-16" width="96" height="32" rx="10" fill="url(#accentGrad)" />
  </g>
  
  <!-- Smart Articulated Bed Silhouette -->
  <!-- Mattress / Head Angle -->
  <path d="M 120 330 L 190 280 L 290 280 L 340 310 L 392 310" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Pillows & Patient Head Support -->
  <circle cx="160" cy="285" r="14" fill="#FFFFFF" opacity="0.9" />
  
  <!-- Chassis & Scissor Column -->
  <path d="M 170 330 L 230 380 L 290 330 L 350 380" fill="none" stroke="#80C6FF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="140" y1="380" x2="372" y2="380" stroke="#80C6FF" stroke-width="14" stroke-linecap="round" />
  
  <!-- Wheels / Casters -->
  <circle cx="160" cy="402" r="14" fill="#FFFFFF" />
  <circle cx="160" cy="402" r="6" fill="#004F8C" />
  <circle cx="352" cy="402" r="14" fill="#FFFFFF" />
  <circle cx="352" cy="402" r="6" fill="#004F8C" />

  <!-- Radio wave signals for IoT BLE / WiFi -->
  <path d="M 330 190 A 40 40 0 0 1 370 230" fill="none" stroke="#80C6FF" stroke-width="10" stroke-linecap="round" />
  <path d="M 345 165 A 75 75 0 0 1 405 225" fill="none" stroke="#80C6FF" stroke-width="10" stroke-linecap="round" opacity="0.6" />
</svg>
